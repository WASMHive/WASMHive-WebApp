<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Distributed Compute Worker Node</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
        }

        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .info-section {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .info-section h3 {
            margin-top: 0;
            color: #87CEEB;
        }

        .status {
            padding: 10px 15px;
            border-radius: 8px;
            font-weight: bold;
            margin: 10px 0;
        }

        .status.connected {
            background: rgba(0, 255, 0, 0.2);
            border: 1px solid rgba(0, 255, 0, 0.5);
        }

        .status.disconnected {
            background: rgba(255, 0, 0, 0.2);
            border: 1px solid rgba(255, 0, 0, 0.5);
        }

        .history-display {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            padding: 15px;
            margin: 10px 0;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .history-item {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 6px;
            padding: 12px;
            margin: 8px 0;
            border-left: 3px solid #87CEEB;
            transition: background 0.3s ease;
        }

        .history-item:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .history-item.latest {
            border-left-color: #90EE90;
            background: rgba(144, 238, 144, 0.1);
        }

        .history-timestamp {
            color: #87CEEB;
            font-size: 12px;
            margin-bottom: 5px;
        }

        .history-message {
            text-align: center;
            color: rgba(255, 255, 255, 0.6);
            padding: 20px;
            font-style: italic;
        }

        .worker-id {
            font-family: 'Courier New', monospace;
            background: rgba(255, 255, 255, 0.1);
            padding: 5px 10px;
            border-radius: 5px;
            display: inline-block;
        }

        .instruction {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            border-left: 4px solid #87CEEB;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 Distributed Compute Worker Node</h1>

        <div class="info-section">
            <h3>Worker Information</h3>
            <p><strong>Worker ID:</strong> <span id="workerId" class="worker-id">Connecting...</span></p>
            <p><strong>WebSocket Status:</strong> <span id="wsStatus" class="status disconnected">Disconnected</span></p>
            <p><strong>Network Peers:</strong> <span id="peerList">None</span></p>
            <p><strong>Total Peers:</strong> <span id="totalPeers">1</span></p>
        </div>

		<div class="info-section">
			<h3>Network Topology</h3>
			<svg id="networkSvg" width="100%" height="320" style="background: rgba(255, 255, 255, 0.05); border-radius: 10px; border: 1px solid rgba(255, 255, 255, 0.1);"></svg>
		</div>

        <div class="info-section">
            <h3>Compute History</h3>
            <div id="computeHistory" class="history-display">
                <div class="history-message">No compute tasks received yet...</div>
            </div>
        </div>

        <div class="info-section">
            <h3>Resource Allocation</h3>
            <div id="allocationSummary" class="history-display">
                <div class="history-message">Waiting for allocation data...</div>
            </div>
        </div>
    </div>

    <script src="worker.js"></script>
</body>
</html>
